name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Reldnahc/tcgplayer-private-api
          ref: 44ec026b714133d8e7c241aca92bc76da5a623e8
          path: .packages/sources/tcgplayer-private-api
      - uses: actions/checkout@v7
        with:
          repository: Reldnahc/manapool-seller-api
          ref: 503fc2e141575c6400286e7e21df287e64344b20
          path: .packages/sources/manapool-seller-api
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Pack pinned API dependencies
        run: |
          for package in tcgplayer-private-api manapool-seller-api; do
            npm ci --prefix ".packages/sources/$package"
            (cd ".packages/sources/$package" && npm pack --pack-destination ../..)
          done
      - run: npm ci
      - run: npm run check
      - name: Install browser test runtime
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium
      - name: Verify operator UI in Chromium
        if: matrix.node-version == 24
        run: npm run test:browser
      - run: npm run audit
