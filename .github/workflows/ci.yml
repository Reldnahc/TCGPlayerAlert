name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Reldnahc/tcgplayer-private-api
          ref: 8665c747585dc34ee50363b35d8e38b30e6676a0
          path: api-package
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Pack API dependency
        run: |
          npm ci --prefix api-package
          mkdir -p .packages
          cd api-package
          npm pack --pack-destination ../.packages
      - run: npm ci
      - run: npm run check
      - run: npm run audit
