name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Reldnahc/tcgplayer-private-api
          ref: 5b73335759414ab6830a1cba54ce91be14f32610
          path: api-package
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Pack API dependency
        run: |
          npm ci --prefix api-package
          mkdir -p .packages
          cd api-package
          npm pack --pack-destination ../.packages
      - run: npm ci
      - run: npm run check
      - name: Install browser test runtime
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium
      - name: Verify operator UI in Chromium
        if: matrix.node-version == 24
        run: npm run test:browser
      - run: npm run audit
